<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Really</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            /* Very dark grey base */
            background-color: #121212; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }
        
        /* The requested Comic Sans styling */
        .comic-sans-title {
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 0 40px rgba(255, 255, 255, 0.2);
        }

        /* Canvas background positioning */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            pointer-events: none; 
        }

        /* Glassmorphism utility for game cards */
        .glass-panel {
            background: rgba(30, 30, 40, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Floating animation for the title */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="relative z-10 flex flex-col min-h-screen">
        <header class="w-full pt-16 pb-10 flex flex-col items-center justify-center">
            <h1 class="text-white text-5xl md:text-7xl font-bold comic-sans-title tracking-wide text-center px-4 animate-float">
                Unblocked Really
            </h1>
            <div class="h-1 w-24 bg-indigo-500 rounded-full mt-6 shadow-[0_0_15px_rgba(99,102,241,0.8)]"></div>
        </header>

        <main class="flex-grow w-full max-w-7xl mx-auto px-6 pb-20 flex flex-col items-center">
            <!-- Grid container for the dynamically generated game cards -->
            <div id="games-container" class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8 justify-center">
                <!-- Cards injected via JavaScript -->
            </div>
        </main>
    </div>

    <script>
        // ========================================================================
        // 🎮 HOW TO ADD GAMES & IMAGES:
        // 1. Put your HTML game file inside the "games" folder.
        // 2. Add an object below with { file: 'FileName.html', image: 'ImageURL' }
        // 3. If you don't have an image, just leave it blank: image: ''
        // ========================================================================
        
        const gamesList = [
            { 
                file: '1 on 1 Tennis.html', 
                image: 'https://bikesense.org/games/v1/ckv/gameimages/1on1tennis.jpg' // Example Tennis URL
            },
            
            // Add more games below:
            // { file: 'YourGame.html', image: 'YOUR_IMAGE_LINK' },
        ];

        const container = document.getElementById('games-container');

        gamesList.forEach(game => {
            // Automatically strip ".html" to create the display name
            // It also replaces hyphens and underscores with spaces for cleaner names
            let displayName = game.file.replace(/\.html$/i, '');
            displayName = displayName.replace(/[-_]/g, ' ');

            // Create placeholder image URL if no image is provided
            const fallbackImage = `https://placehold.co/400x250/1e1e28/ffffff?text=${encodeURIComponent(displayName)}`;
            const imageUrl = game.image ? game.image : fallbackImage;

            const card = document.createElement('a');
            card.href = `games/${game.file}`;
            
            // Apply Glassmorphism & modern hover states for a card look
            card.className = `
                glass-panel flex flex-col rounded-2xl overflow-hidden
                transform transition-all duration-300 ease-out group
                hover:-translate-y-3 hover:border-indigo-400/50 hover:shadow-[0_0_25px_rgba(99,102,241,0.4)]
                cursor-pointer relative
            `;
            
            card.innerHTML = `
                <div class="h-40 w-full bg-gray-900 relative overflow-hidden border-b border-white/5">
                    <img src="${imageUrl}" alt="${displayName}" 
                         class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                         onerror="this.src='${fallbackImage}'"> <!-- Fallback if URL breaks -->
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                </div>
                <div class="p-5 flex-grow flex items-center justify-center relative z-10">
                    <span class="text-gray-100 text-xl font-bold text-center capitalize drop-shadow-md group-hover:text-indigo-300 transition-colors">
                        ${displayName}
                    </span>
                </div>
            `;
            
            container.appendChild(card);
        });

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fill the screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Particle configuration
        const particlesArray = [];
        const numParticles = Math.min(Math.floor(window.innerWidth / 15), 120); 
        const connectionDistance = 150;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1; 
                this.speedX = (Math.random() - 0.5) * 0.7;
                this.speedY = (Math.random() - 0.5) * 0.7;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(140, 150, 255, 0.4)'; 
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray.length = 0; 
            for (let i = 0; i < numParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    const dx = particlesArray[a].x - particlesArray[b].x;
                    const dy = particlesArray[a].y - particlesArray[b].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        const opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(99, 102, 241, ${opacity * 0.3})`; 
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animateLoop);
        }

        window.onload = function() {
            initParticles();
            animateLoop();
        };
    </script>
</body>
</html>
